# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# rusty-opus has ZERO runtime dependencies; everything below governs the
# dev-dependency graph (tests, benches, fuzzing) and any future runtime dep.

[graph]
all-features = true

[advisories]
# Every RustSec advisory is an error unless explicitly ignored below with a
# dated justification.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with the crate's BSD-3-Clause.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
# The shipped crate has zero runtime dependencies, so most of this allow-list is
# for future deps and the dev graph; unused entries are expected, not noise.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
