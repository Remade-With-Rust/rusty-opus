
# cargo-vet audits file

[[audits.bitflags]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "2.13.0"
notes = "safe-to-run side-effect review, 2026-10-04: macro + flag types only; no fs/net/process/env-mutation, no build.rs. Dev-only (proptest)."

[[audits.cc]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "1.2.66"
notes = "safe-to-run side-effect review, 2026-10-04: build-time C compiler driver; spawns the configured C compiler and writes objects into OUT_DIR, which is its documented purpose; no network. Dev-only (rusty_alloc -> alloca)."

[[audits.criterion]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "0.8.2"
notes = "safe-to-run side-effect review, 2026-10-04: TcpStream only to localhost on a cargo-criterion-provided port; fs writes confined to the target/criterion output dir; one process spawn = `cargo metadata` to locate the target dir; no env mutation, no build.rs. Dev-only (benches)."

[[audits.find-msvc-tools]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "0.1.9"
notes = "safe-to-run side-effect review, 2026-10-04: locates MSVC tools (registry/vswhere lookups, spawns vswhere); no network, no fs writes. Dev-only (cc)."

[[audits.half]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "2.7.1"
notes = "safe-to-run side-effect review, 2026-10-04: pure f16/bf16 numeric types; no fs/net/process/env-mutation, no build.rs. Dev-only (criterion -> ciborium)."

[[audits.proptest]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "1.11.0"
notes = "safe-to-run side-effect review, 2026-10-04: std::net only in Arbitrary value generators (no I/O); fs writes are failure-persistence/replay files next to the test sources; no process spawn, no build.rs. Built with default-features off (no fork/timeout). Dev-only (property tests)."

[[audits.r-efi]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "5.3.0"
notes = "safe-to-run side-effect review, 2026-10-04: UEFI type/ABI definitions only; no fs/net/process/env-mutation, no build.rs. Only compiled for UEFI targets (getrandom)."

[[audits.winapi-i686-pc-windows-gnu]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "0.4.0"
notes = "safe-to-run side-effect review, 2026-10-04: build.rs (18 lines) only emits a rustc-link-search path to bundled import libraries; empty lib. Dev-only."

[[audits.winapi-x86_64-pc-windows-gnu]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "0.4.0"
notes = "safe-to-run side-effect review, 2026-10-04: build.rs (18 lines) only emits a rustc-link-search path to bundled import libraries; empty lib. Dev-only."

[[audits.zerocopy]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "0.8.53"
notes = "safe-to-run side-effect review, 2026-10-04: build.rs reads its own Cargo.toml and runs `rustc --version` for version detection; no network, no fs writes outside the build; no env mutation. Dev-only (half, ppv-lite86)."

[[audits.zerocopy-derive]]
who = "Tim Almond (AI-assisted review by Claude)"
criteria = "safe-to-run"
version = "0.8.53"
notes = "safe-to-run side-effect review, 2026-10-04: proc-macro; the only fs write is in its own cfg(test) output_tests module; no network, no process spawn. Dev-only (zerocopy)."

