# Dependency updates arrive as pull requests and are merged only after human
# review and a green CI run (hardening gate H-14).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    labels: [dependencies, fuzzing]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
