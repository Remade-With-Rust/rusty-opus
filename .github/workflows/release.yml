# Release artifacts for a version tag (use-protection-please H-12, H-38): the
# packaged crate, a CycloneDX SBOM, and a signed build-provenance attestation,
# attached to the GitHub release. Publishing to crates.io stays a manual,
# maintainer-run step (`cargo publish`).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # OIDC for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Verify the tag matches Cargo.toml
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$v" = "${GITHUB_REF_NAME}"
      - name: Package the crate
        run: cargo package --locked
      - name: SBOM (CycloneDX JSON)
        run: |
          cargo cyclonedx --format json --override-filename rusty-opus-sbom
          cp rusty-opus-sbom.json target/package/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/package/rusty-opus-*.crate
            target/package/rusty-opus-sbom.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            target/package/rusty-opus-*.crate
            target/package/rusty-opus-sbom.json
          body_path: .github/release-notes.md
